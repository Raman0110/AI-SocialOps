# Local full stack: docker compose up --build
# Runs in Development mode (sample data, sandbox webhook and sender). Copy .env.example to .env
# and set GROQ_API_KEY first. For a real deployment see docs/DEPLOYMENT.md.
services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: socialops-postgres

    environment:
      POSTGRES_DB: socialops
      POSTGRES_USER: socialops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-socialops}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U socialops -d socialops" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api

    container_name: socialops-api

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: Host=postgres; Port=5432; Database=socialops; Username=socialops; Password=${POSTGRES_PASSWORD:-socialops}

      Agent__BaseUrl: http://agent:8000

      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY:-development-only-socialops-signing-key-change-in-production}

      # Real Instagram (leave blank to stay on the sandbox). See docs/INSTAGRAM_SETUP.md.
      Instagram__AppSecret: ${INSTAGRAM_APP_SECRET:-}
      Instagram__VerifyToken: ${INSTAGRAM_VERIFY_TOKEN:-}
      Instagram__AccessTokens__${INSTAGRAM_ACCOUNT_ID:-unset}: ${INSTAGRAM_ACCESS_TOKEN:-}

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

  agent:
    build:
      context: ./apps/agent

    container_name: socialops-agent

    env_file:
      - ./apps/agent/.env

    environment:
      SOCIALOPS_API_URL: http://api:8080
      # Machine credential for secured internal tools; it has Agent rather than Owner access.
      SOCIALOPS_API_KEY: ${SOCIALOPS_API_KEY:-dev-agent-key}

    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}

    container_name: socialops-web

    ports:
      - "5173:80"

    depends_on:
      - api

volumes:
  postgres_data:
